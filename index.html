<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>أكاديمية الإمام الباجي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface2: #F8F9FA;
  --ink: #1A1A1A;
  --ink2: #555;
  --ink3: #888;
  --accent: #0D3B2E;
  --accent2: #D4A843;
  --border: #E5E5E5;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);

  /* colored boxes — near-white backgrounds, colored right border only */
  --quran-bg: #F6FAF6; --quran-border: #1B7A3D; --quran-text: #1B7A3D;
  --hadith-bg: #FDFAF6; --hadith-border: #8B4513; --hadith-text: #8B4513;
  --poetry-bg: #FAF6FB; --poetry-border: #6A1B9A; --poetry-text: #6A1B9A;
  --benefit-bg: #F5FAFA; --benefit-border: #00796B; --benefit-text: #00796B;
  --warning-bg: #FDF7F6; --warning-border: #C62828; --warning-text: #C62828;
  --def-bg: #F6F7FB; --def-border: #1A237E; --def-text: #1A237E;

  /* tabs */
  --tab-active-bg: #0D3B2E;
  --tab-active-text: #FFFFFF;
  --tab-inactive-bg: transparent;
  --tab-inactive-text: #555;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E0E;
    --surface: #1E1E1E;
    --surface2: #252525;
    --ink: #E8E6E1;
    --ink2: #AAA;
    --ink3: #777;
    --accent: #2E8B6E;
    --accent2: #D4A843;
    --border: #333;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);

    --quran-bg: #1B3D20; --quran-border: #4CAF50; --quran-text: #A5D6A7;
    --hadith-bg: #3E2200; --hadith-border: #CD7F32; --hadith-text: #FFCC80;
    --poetry-bg: #2A0845; --poetry-border: #AB47BC; --poetry-text: #CE93D8;
    --benefit-bg: #003333; --benefit-border: #26A69A; --benefit-text: #80CBC4;
    --warning-bg: #3B0A0A; --warning-border: #EF5350; --warning-text: #EF9A9A;
    --def-bg: #0D1440; --def-border: #5C6BC0; --def-text: #9FA8DA;

    --tab-active-bg: #2E8B6E;
    --tab-active-text: #FFF;
    --tab-inactive-text: #AAA;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E0E;
  --surface: #1E1E1E;
  --surface2: #252525;
  --ink: #E8E6E1;
  --ink2: #AAA;
  --ink3: #777;
  --accent: #2E8B6E;
  --accent2: #D4A843;
  --border: #333;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);

  --quran-bg: #1B3D20; --quran-border: #4CAF50; --quran-text: #A5D6A7;
  --hadith-bg: #3E2200; --hadith-border: #CD7F32; --hadith-text: #FFCC80;
  --poetry-bg: #2A0845; --poetry-border: #AB47BC; --poetry-text: #CE93D8;
  --benefit-bg: #003333; --benefit-border: #26A69A; --benefit-text: #80CBC4;
  --warning-bg: #3B0A0A; --warning-border: #EF5350; --warning-text: #EF9A9A;
  --def-bg: #0D1440; --def-border: #5C6BC0; --def-text: #9FA8DA;

  --tab-active-bg: #2E8B6E;
  --tab-active-text: #FFF;
  --tab-inactive-text: #AAA;
}


/* ── STUDENT NAME ── */
.student-name {
  font-size: 13px;
  opacity: 0.8;
  font-weight: 400;
  margin-top: 2px;
  letter-spacing: 0.5px;
}

/* ── YEAR BAR ── */
.year-bar {
  background: var(--accent);
  padding: 8px 16px 0;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.year-bar::-webkit-scrollbar { display: none; }
.year-chip {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 10px 10px 0 0;
  font-size: 12px;
  font-weight: 600;
  border: none;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.year-chip.active {
  background: var(--bg);
  color: var(--ink);
}
.year-chip .yc-icon {
  margin-left: 4px;
  font-size: 13px;
}

/* ── MODE BAR (دروس / مرفقات) ── */
.mode-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  justify-content: center;
}
.mode-chip {
  padding: 7px 22px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.mode-chip.active {
  background: var(--accent2);
  color: #1A1A1A;
  border-color: var(--accent2);
}
.mode-chip .mc-icon { margin-left: 4px; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Naskh Arabic', 'Amiri', serif;
  background: var(--bg);
  color: var(--ink);
  direction: rtl;
  text-align: right;
  line-height: 1.7;
  min-height: 100vh;
}

/* ── HEADER ── */
.app-header {
  background: var(--accent);
  color: #FFF;
  padding: 20px 16px 14px;
  text-align: center;
  position: relative;
}
.app-header h1 {
  font-family: 'Amiri', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent2);
  margin-bottom: 2px;
}
.app-header .subtitle {
  font-size: 12px;
  opacity: 0.75;
  font-weight: 300;
}
.bismillah {
  font-family: 'Amiri', serif;
  font-size: 16px;
  color: var(--accent2);
  margin-bottom: 6px;
}

/* ── SUBJECT SELECTOR ── */
.subject-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  overflow-x: auto;
  display: flex;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}
.subject-bar::-webkit-scrollbar { display: none; }
.subject-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.subject-chip.active {
  background: var(--accent);
  color: #FFF;
  border-color: var(--accent);
}
.subject-chip .chip-icon { margin-left: 4px; font-size: 14px; }

/* ── LESSON SELECTOR ── */
.lesson-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.lesson-select {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  border: 2px solid var(--accent);
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  direction: rtl;
}
.lesson-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}

/* ── VIEW TABS ── */
.view-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
}
.view-tab {
  flex: 1;
  text-align: center;
  padding: 8px 0 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--tab-inactive-text);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
}
.view-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.view-tab .tab-icon { display: block; font-size: 16px; margin-bottom: 1px; }

/* ── MAIN CONTENT ── */
.content {
  padding: 20px 18px;
  max-width: 800px;
  margin: 12px auto;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ── SUMMARY VIEW ── */
.section-title {
  font-family: 'Amiri', serif;
  font-size: 16px;
  font-weight: 700;
  color: #FFF;
  background: var(--accent);
  margin: 18px 0 8px;
  padding: 8px 14px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title:first-child { margin-top: 0; }
.section-title .icon { font-size: 18px; }

.box {
  border-radius: 8px;
  padding: 10px 12px;
  margin: 6px 0;
  border: 1px solid var(--border);
  border-right: 4px solid;
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink);
}
.box-label {
  font-weight: 700;
  font-size: 12px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.box-quran {
  background: var(--quran-bg);
  border-right-color: var(--quran-border);
}
.box-quran .box-label { color: var(--quran-text); }
.box-hadith {
  background: var(--hadith-bg);
  border-right-color: var(--hadith-border);
}
.box-hadith .box-label { color: var(--hadith-text); }
.box-poetry {
  background: var(--poetry-bg);
  border-right-color: var(--poetry-border);
}
.box-poetry .box-label { color: var(--poetry-text); }
.box-benefit {
  background: var(--benefit-bg);
  border-right-color: var(--benefit-border);
}
.box-benefit .box-label { color: var(--benefit-text); }
.box-warning {
  background: var(--warning-bg);
  border-right-color: var(--warning-border);
}
.box-warning .box-label { color: var(--warning-text); }
.box-def {
  background: var(--def-bg);
  border-right-color: var(--def-border);
}
.box-def .box-label { color: var(--def-text); }

.summary-text {
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink);
  margin: 4px 0;
}
.summary-text b { color: var(--accent); font-weight: 700; }
.box b { color: var(--accent); font-weight: 700; }

/* Tables */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  direction: rtl;
  font-size: 13px;
}
.data-table th {
  background: var(--accent);
  color: #FFF;
  padding: 8px 10px;
  font-weight: 600;
  text-align: right;
}
.data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:nth-child(even) td { background: var(--surface2); }

/* ── MAP VIEW ── */
.map-container {
  text-align: center;
}
.map-image-wrapper {
  margin: 12px 0;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  background: var(--surface);
}
.map-image-wrapper img {
  width: 100%;
  height: auto;
  display: block;
}
.map-caption {
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink2);
  background: var(--surface2);
  border-top: 1px solid var(--border);
}
.no-map-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink3);
  font-size: 14px;
}
.no-map-msg .big-icon { font-size: 48px; display: block; margin-bottom: 12px; }

/* ── AUTO MIND MAP ── */
.mm-wrap { text-align: center; padding: 8px 0; }
.mm-center {
  display: inline-block;
  background: var(--accent);
  color: #FFF;
  font-family: 'Amiri', serif;
  font-size: 16px;
  font-weight: 700;
  padding: 10px 24px;
  border-radius: 24px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.mm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  text-align: right;
}
.mm-branch {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.mm-branch-title {
  background: var(--accent2);
  color: #FFF;
  font-family: 'Amiri', serif;
  font-size: 14px;
  font-weight: 700;
  padding: 7px 12px;
}
.mm-items { padding: 8px 10px; }
.mm-item {
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink);
  padding: 3px 0;
  border-bottom: 1px dashed var(--border);
}
.mm-item:last-child { border-bottom: none; }
.mm-item b { color: var(--accent); font-weight: 700; }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  margin: 16px 0;
  transition: all 0.2s;
  color: var(--ink3);
}
.upload-zone:hover { border-color: var(--accent); background: var(--surface2); }
.upload-zone .uz-icon { font-size: 36px; margin-bottom: 8px; display: block; }

/* ── QUIZ VIEW ── */
.quiz-progress {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.quiz-progress .score { font-weight: 700; color: var(--accent); }
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  flex: 1;
  margin: 0 12px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
}

.quiz-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.quiz-q-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent2);
  margin-bottom: 4px;
}
.quiz-q-text {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
  line-height: 1.7;
}
.quiz-opt {
  display: block;
  width: 100%;
  text-align: right;
  padding: 10px 14px;
  margin-bottom: 6px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.6;
}
.quiz-opt:hover:not(.answered) {
  border-color: var(--accent);
  background: var(--benefit-bg);
}
.quiz-opt.correct {
  background: #C8E6C9 !important;
  border-color: #2E7D32 !important;
  color: #1B5E20 !important;
}
.quiz-opt.wrong {
  background: #FFCDD2 !important;
  border-color: #C62828 !important;
  color: #B71C1C !important;
}
.quiz-opt.answered { cursor: default; }
.quiz-exp {
  margin-top: 8px;
  padding: 10px 12px;
  background: var(--benefit-bg);
  border-radius: 8px;
  font-size: 13px;
  color: var(--benefit-text);
  display: none;
  border-right: 3px solid var(--benefit-border);
}
.quiz-exp.show { display: block; }

.quiz-result {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  box-shadow: var(--shadow);
  margin-top: 16px;
}
.quiz-result .big-score {
  font-size: 42px;
  font-weight: 700;
  color: var(--accent);
}
.quiz-result .result-label {
  font-size: 14px;
  color: var(--ink2);
  margin: 8px 0;
}
.btn-retry {
  padding: 10px 28px;
  border-radius: 8px;
  background: var(--accent);
  color: #FFF;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}

/* ── REVISION VIEW ── */
.rev-progress {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.rev-progress .rp-text { flex: 1; }

.rev-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.rev-card.known {
  opacity: 0.5;
  border-color: #4CAF50;
}
.rev-card .rev-q {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.rev-card .rev-q .q-icon { color: var(--accent2); font-size: 16px; flex-shrink: 0; }
.rev-card .rev-a {
  display: none;
  margin-top: 8px;
  padding: 10px 12px;
  background: var(--benefit-bg);
  border-radius: 8px;
  font-size: 13px;
  color: var(--benefit-text);
  line-height: 1.8;
  border-right: 3px solid var(--benefit-border);
}
.rev-card .rev-a.show { display: block; }
.rev-actions {
  display: none;
  margin-top: 8px;
  text-align: left;
}
.rev-actions.show { display: block; }
.btn-known {
  padding: 6px 14px;
  border-radius: 6px;
  background: #4CAF50;
  color: #FFF;
  border: none;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-known.undo {
  background: var(--ink3);
}

/* ── EMPTY / PLACEHOLDER ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink3);
}
.empty-state .es-icon { font-size: 48px; display: block; margin-bottom: 12px; }

/* ── EXPORT BUTTON ── */
.btn-export {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 24px auto 4px;
  padding: 10px 28px;
  border-radius: 8px;
  background: var(--accent);
  color: #FFF;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn-export:hover { opacity: 0.85; }
.btn-export .exp-icon { font-size: 16px; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .app-header h1 { font-size: 18px; }
  .content { padding: 12px; }
  .section-title { font-size: 17px; }
}
</style>
</head>
<body>
<div class="app-header">
  <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
  <h1>أكاديمية الإمام الباجي</h1>
  <div class="subtitle">ملخصات ومراجعات</div>
  <div class="student-name">إبراهيم قلات</div>
</div>
<div class="year-bar" id="yearBar"></div>
<div class="subject-bar" id="subjectBar"></div>
<div class="mode-bar" id="modeBar"></div>

<div class="lesson-bar" id="lessonBar">
  <span class="lesson-label">الدرس:</span>
  <select class="lesson-select" id="lessonSelect"></select>
</div>

<div class="view-tabs" id="viewTabs">
  <div class="view-tab active" data-view="summary">
    <span class="tab-icon">📝</span>الملخص
  </div>
  <div class="view-tab" data-view="map">
    <span class="tab-icon">🗺️</span>الخريطة
  </div>
  <div class="view-tab" data-view="quiz">
    <span class="tab-icon">✅</span>اختبار
  </div>
  <div class="view-tab" data-view="revision">
    <span class="tab-icon">🔄</span>المراجعة
  </div>
</div>

<div class="content" id="mainContent"></div>

<script>

/* ════════════════════════════════════════════════════════
   DATA MODEL
   ════════════════════════════════════════════════════════ */

function storageGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; }
}
function storageSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

let quizState = storageGet("baji_quiz_v3", {});
let knownState = storageGet("baji_known_v3", {});

function renderLessons() {

   ════════════════════════════════════════════════════════ */
function renderTabs() {
  document.querySelectorAll(".view-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.view === currentView);

      currentView = t.dataset.view;

/* ════════════════════════════════════════════════════════
   RENDER: Content dispatcher
   ════════════════════════════════════════════════════════ */
function renderContent() {
  const mc = document.getElementById("mainContent");
  const lessons = LESSONS[currentSubject] || [];
  if (!lessons.length) {
    mc.innerHTML = `<div class="empty-state"><span class="es-icon">📚</span>لم تُضَف دروس لهذه المادة بعد.<br>أرسل نصّ الدرس لإضافته.</div>`;
    return;
  }
  const lesson = lessons[currentLessonIdx];
  if (!lesson) { mc.innerHTML = ""; return; }

  switch (currentView) {
    case "summary": renderSummary(mc, lesson); break;
    case "map":     renderMap(mc, lesson); break;
    case "quiz":    renderQuiz(mc, lesson); break;
    case "revision":renderRevision(mc, lesson); break;
  }
}

/* ── Utility: line-break before circled numbers ── */
function fmtNums(s) { return s ? s.replace(/ ([①②③④⑤⑥⑦⑧⑨⑩])/g, '<br>$1') : ''; }

/* ════════════════════════════════════════════════════════
   RENDER: Summary
   ════════════════════════════════════════════════════════ */
function renderSummary(mc, lesson) {
  let html = "";
  (lesson.summary || []).forEach(section => {
    html += `<div class="section-title"><span class="icon">📌</span>${section.heading}</div>`;
    (section.items || []).forEach(item => {
      const c = item.content ? fmtNums(item.content) : '';
      switch (item.type) {
        case "text":
          html += `<div class="summary-text">${c}</div>`;
          break;
        case "quran":
          html += `<div class="box box-quran"><div class="box-label">🟢 آية قرآنية</div>${c}</div>`;
          break;
        case "hadith":
          html += `<div class="box box-hadith"><div class="box-label">🟠 حديث نبوي</div>${c}</div>`;
          break;
        case "poetry":
          html += `<div class="box box-poetry"><div class="box-label">🟣 أبيات / منظومة</div><div style="white-space:pre-wrap;font-family:'Amiri',serif;font-size:15px;line-height:2">${c}</div></div>`;
          break;
        case "benefit":
          html += `<div class="box box-benefit"><div class="box-label">💎 فائدة</div>${c}</div>`;
          break;
        case "warning":
          html += `<div class="box box-warning"><div class="box-label">⚠️ تنبيه</div>${c}</div>`;
          break;
        case "def":
          html += `<div class="box box-def"><div class="box-label">📘 تعريف / ضابط</div>${c}</div>`;
          break;
        case "table":
          html += `<table class="data-table"><thead><tr>`;
          item.headers.forEach(h => html += `<th>${h}</th>`);
          html += `</tr></thead><tbody>`;
          item.rows.forEach(r => {
            html += `<tr>`;
            r.forEach(cell => html += `<td>${cell}</td>`);
            html += `</tr>`;
          });
          html += `</tbody></table>`;
          break;
      }
    });
  });

  /* Export PDF button */
  html += `<button class="btn-export" onclick="exportFile()"><span class="exp-icon">📄</span>تصدير الملخص PDF</button>`;

  mc.innerHTML = html;
}

/* ════════════════════════════════════════════════════════
   EXPORT PDF via html2pdf.js + downloads capability
   ════════════════════════════════════════════════════════ */
async function exportFile() {
  var subj = SUBJECTS_BY_YEAR[currentYear].find(function(s){ return s.id === currentSubject; });
  var lessons = LESSONS[currentSubject] || [];
  var lesson = lessons[currentLessonIdx];
  if (!subj || !lesson) return;

  var btn = document.querySelector('.btn-export');
  var origText = btn.innerHTML;
  btn.innerHTML = '<span class="exp-icon">⏳</span>جارٍ التصدير...';
  btn.disabled = true;

  try {
    /* Standalone browser download helper */
    var dl = {
      save: function(opts) {
        var a = document.createElement('a');
        var blob = (opts.data instanceof Blob) ? opts.data : new Blob([opts.data], {type:'application/octet-stream'});
        var url = URL.createObjectURL(blob);
        a.href = url;
        a.download = opts.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
        return Promise.resolve();
      }
    };
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    var lessonTitle = subj.name + ' — الدرس ' + lesson.num + ': ' + lesson.title;

    /* ─── Helper: build one item's HTML from data ─── */
    function itemHtml(item) {
      var t = item.type || 'text';
      var txt = typeof item === 'string' ? item : (item.content || item.text || item.html || '');
      txt = fmtNums(txt);

      var base = 'margin:0 0 10px;padding:12px 16px;border-radius:6px;font-size:14px;line-height:1.9;word-wrap:break-word;overflow-wrap:break-word;';

      if (t === 'quran') {
        return '<div style="' + base + 'background:#FDF6EC;border-right:4px solid #C8A84E;font-family:Amiri,serif;font-size:16px;line-height:2.1;text-align:center;color:#5D4E37;">' + txt + '</div>';
      } else if (t === 'hadith') {
        return '<div style="' + base + 'background:#F0F7F4;border-right:4px solid #2E7D5B;">' + txt + '</div>';
      } else if (t === 'benefit') {
        return '<div style="' + base + 'background:#EEF7FF;border-right:4px solid #2B7BBF;">' + txt + '</div>';
      } else if (t === 'warning') {
        return '<div style="' + base + 'background:#FFF5F5;border-right:4px solid #C53030;">' + txt + '</div>';
      } else if (t === 'def') {
        return '<div style="' + base + 'background:#F5F0FF;border-right:4px solid #6B46C1;">' + txt + '</div>';
      } else if (t === 'poetry') {
        return '<div style="' + base + 'background:#FFFBEB;border-right:4px solid #D69E2E;font-family:Amiri,serif;font-size:15px;line-height:2.1;text-align:center;">' + txt + '</div>';
      } else if (t === 'table') {
        var h = '<table style="width:100%;border-collapse:collapse;margin:0 0 10px;font-size:13px;table-layout:fixed;word-wrap:break-word;">';
        if (item.headers) {
          h += '<thead><tr>';
          item.headers.forEach(function(hd){ h += '<th style="background:#0D3B2E;color:#fff;padding:8px 10px;text-align:right;font-weight:600;">' + hd + '</th>'; });
          h += '</tr></thead>';
        }
        if (item.rows) {
          h += '<tbody>';
          item.rows.forEach(function(row, ri){
            h += '<tr>';
            row.forEach(function(cell){ h += '<td style="padding:7px 10px;border-bottom:1px solid #E5E7EB;text-align:right;word-wrap:break-word;' + (ri % 2 === 1 ? 'background:#F9FAFB;' : '') + '">' + cell + '</td>'; });
            h += '</tr>';
          });
          h += '</tbody>';
        }
        h += '</table>';
        return h;
      } else {
        return '<div style="' + base + 'background:#F8FAF9;border-right:4px solid #0D3B2E;">' + txt + '</div>';
      }
    }

    /* ─── Build clean content HTML from lesson data ─── */
    var contentHtml = '';
    if (lesson.summary && lesson.summary.length) {
      lesson.summary.forEach(function(section) {
        contentHtml += '<div style="background:#0D3B2E;color:#fff;padding:9px 16px;border-radius:6px;font-size:15px;font-weight:700;margin:18px 0 10px;">' + (section.heading || section.title || '') + '</div>';
        if (section.items && section.items.length) {
          section.items.forEach(function(item) {
            contentHtml += itemHtml(item);
          });
        }
      });
    }

    /* ─── Create render wrapper with fully controlled styles ─── */
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:0;top:0;width:750px;z-index:99998;background:#FFFFFF;color:#1A1A1A;padding:30px 26px;direction:rtl;font-family:"Noto Naskh Arabic",Tahoma,sans-serif;line-height:1.9;overflow:hidden;';

    wrap.innerHTML = ''
      /* Header */
      + '<div style="text-align:center;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #0D3B2E;">'
      + '<div style="font-family:Amiri,serif;font-size:13px;color:#999;margin-bottom:6px;">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>'
      + '<div style="font-size:22px;font-weight:700;color:#0D3B2E;">أكاديمية الإمام الباجي</div>'
      + '<div style="font-size:14px;color:#555;margin-top:4px;">' + subj.icon + ' ' + lessonTitle + '</div>'
      + (subj.sheikh ? '<div style="font-size:13px;color:#666;margin-top:2px;">الشيخ: ' + subj.sheikh + '</div>' : '')
      + '<div style="font-size:12px;color:#999;margin-top:4px;">الطالب: إبراهيم قلات</div>'
      + '</div>'
      /* Content built from data */
      + contentHtml
      /* Footer */
      + '<div style="text-align:center;margin-top:24px;padding-top:10px;border-top:1px solid #E0E0E0;font-size:11px;color:#999;">أكاديمية الإمام الباجي — الطالب: إبراهيم قلات</div>';

    document.body.appendChild(wrap);
    await new Promise(function(r){ setTimeout(r, 400); });

    var pdfGenerated = false;

    if (typeof html2canvas === 'function') {
      try {
        var canvas = await html2canvas(wrap, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          logging: false,
          width: 750,
          windowWidth: 750,
          scrollY: -window.scrollY
        });

        /* Check if canvas has actual content */
        var ctx = canvas.getContext('2d');
        var sampleData = ctx.getImageData(0, 0, Math.min(canvas.width, 500), Math.min(canvas.height, 300)).data;
        var nonWhite = 0;
        for (var i = 0; i < sampleData.length; i += 4) {
          if (sampleData[i] < 245 || sampleData[i+1] < 245 || sampleData[i+2] < 245) {
            nonWhite++;
            if (nonWhite > 50) break;
          }
        }

        if (nonWhite > 50) {
          var jsPDFClass = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
          if (jsPDFClass) {
            var pxW = canvas.width;
            var pxH = canvas.height;
            var pageW = 210;
            var pageH = 297;
            var margin = 10;
            var contentW = pageW - margin * 2;
            var scaledH = (pxH / pxW) * contentW;
            var pageContentH = pageH - margin * 2;

            var pdf = new jsPDFClass({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            var totalPages = Math.ceil(scaledH / pageContentH);

            for (var p = 0; p < totalPages; p++) {
              if (p > 0) pdf.addPage();

              /* Slice canvas for this page */
              var srcY = Math.round((p * pageContentH / scaledH) * pxH);
              var srcH = Math.round(Math.min((pageContentH / scaledH) * pxH, pxH - srcY));
              if (srcH <= 0) break;

              var pageCanvas = document.createElement('canvas');
              pageCanvas.width = pxW;
              pageCanvas.height = srcH;
              var pCtx = pageCanvas.getContext('2d');
              pCtx.fillStyle = '#FFFFFF';
              pCtx.fillRect(0, 0, pxW, srcH);
              pCtx.drawImage(canvas, 0, srcY, pxW, srcH, 0, 0, pxW, srcH);

              var sliceData = pageCanvas.toDataURL('image/jpeg', 0.92);
              var destH = (srcH / pxH) * scaledH;
              pdf.addImage(sliceData, 'JPEG', margin, margin, contentW, destH);
            }

            var pdfBlob = pdf.output('blob');
            if (pdfBlob.size > 5000) {
              var fileName = subj.name + ' - الدرس ' + lesson.num + ' - ' + lesson.title + '.pdf';
              await dl.save({ filename: fileName, data: pdfBlob });
              pdfGenerated = true;
            }
          }
        }
      } catch(e) {
        /* html2canvas failed, fall through */
      }
    }

    document.body.removeChild(wrap);

    /* Fallback: save as styled HTML with auto-print */
    if (!pdfGenerated) {
      var htmlFallback = '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">'
        + '<title>' + lessonTitle + '</title>'
        + '<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">'
        + '<style>'
        + '*{box-sizing:border-box;margin:0;padding:0}'
        + 'body{font-family:"Noto Naskh Arabic",Tahoma,sans-serif;background:#F3F4F6;color:#1A1A1A;direction:rtl;line-height:1.9;padding:0}'
        + '@media print{@page{size:A4;margin:15mm 12mm}body{background:#fff!important;padding:0!important}.pc{box-shadow:none!important;margin:0!important;border-radius:0!important}.no-print{display:none!important}}'
        + '@media screen{body{padding:20px}}'
        + '.pc{max-width:800px;margin:0 auto;background:#fff;padding:32px 28px;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.07)}'
        + '</style></head><body><div class="pc">'
        + wrap.innerHTML
        + '</div>'
        + '<div class="no-print" style="text-align:center;margin:20px;font-family:sans-serif;color:#666;font-size:14px;">'
        + '<button onclick="window.print()" style="background:#0D3B2E;color:#fff;border:none;padding:10px 28px;border-radius:8px;font-size:15px;cursor:pointer;font-family:Noto Naskh Arabic,sans-serif;">🖨️ طباعة / حفظ PDF</button>'
        + '</div>'
        + '<script>window.onload=function(){setTimeout(function(){window.print()},800)};<\/script>'
        + '</body></html>';

      var fileName = subj.name + ' - الدرس ' + lesson.num + ' - ' + lesson.title + '.html';
      var htmlBlob = new Blob([htmlFallback], { type: 'text/html;charset=utf-8' });
      await dl.save({ filename: fileName, data: htmlBlob });
    }

    btn.innerHTML = '<span class="exp-icon">✅</span>تم التصدير';
    btn.disabled = false;
    setTimeout(function(){ btn.innerHTML = origText; }, 2500);

  } catch(err) {
    btn.innerHTML = origText;
    btn.disabled = false;
  }
}

/* ════════════════════════════════════════════════════════
   RENDER: Map (academy images)
   ════════════════════════════════════════════════════════ */
function renderMap(mc, lesson) {
  const maps = lesson.maps || [];
  const hasAcademyMaps = maps.length && maps.some(m => m.dataUrl);
  const mm = lesson.mindmap;

  if (!hasAcademyMaps && !mm) {
    mc.innerHTML = `<div class="no-map-msg">
      <span class="big-icon">🗺️</span>
      <b>الخريطة الذهنية</b><br>
      لم تُرفع خرائط ذهنية لهذا الدرس بعد.
    </div>`;
    return;
  }

  let html = '';

  /* Academy-provided images */
  if (hasAcademyMaps) {
    html += `<div class="map-container">`;
    maps.forEach((m, i) => {
      if (!m.dataUrl) return;
      html += `<div class="map-image-wrapper">
        <img src="${m.dataUrl}" alt="${m.caption}">
        <div class="map-caption">${m.caption}</div>
      </div>`;
    });
    html += `</div>`;
  }

  /* Auto-generated mind map */
  if (mm) {
    if (hasAcademyMaps) html += `<div style="margin:18px 0 8px;font-size:13px;color:var(--ink3);text-align:center;">— خريطة ذهنية تلخيصية —</div>`;
    html += `<div class="mm-wrap">`;
    html += `<div class="mm-center">${mm.center}</div>`;
    html += `<div class="mm-grid">`;
    mm.branches.forEach(b => {
      html += `<div class="mm-branch"><div class="mm-branch-title">${b.label}</div><div class="mm-items">`;
      b.items.forEach(it => { html += `<div class="mm-item">${it}</div>`; });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  }

  mc.innerHTML = html;
}

/* ════════════════════════════════════════════════════════
   RENDER: Quiz
   ════════════════════════════════════════════════════════ */
function renderQuiz(mc, lesson) {
  const quiz = lesson.quiz || [];
  if (!quiz.length) {
    mc.innerHTML = `<div class="empty-state"><span class="es-icon">✅</span>لم تُضَف أسئلة لهذا الدرس بعد.</div>`;
    return;
  }

  const key = qKey();
  if (!quizState[key]) quizState[key] = { answers: {}, score: 0 };
  const qs = quizState[key];
  const total = quiz.length;
  const answered = Object.keys(qs.answers).length;
  const pct = total ? Math.round((answered / total) * 100) : 0;

  let html = `<div class="quiz-progress">
    <span class="score">${qs.score} / ${total}</span>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span>${answered} / ${total}</span>
  </div>`;

  if (answered === total) {
    const pctScore = Math.round((qs.score / total) * 100);
    let emoji = pctScore >= 80 ? "🎉" : pctScore >= 50 ? "👍" : "💪";
    html += `<div class="quiz-result">
      <div class="big-score">${emoji} ${pctScore}%</div>
      <div class="result-label">${qs.score} من ${total} إجابة صحيحة</div>
      <button class="btn-retry" onclick="retryQuiz()">🔄 إعادة الاختبار</button>
    </div>`;
  }

  quiz.forEach((item, i) => {
    const userAnswer = qs.answers[i];
    const isAnswered = userAnswer !== undefined;
    html += `<div class="quiz-card">
      <div class="quiz-q-num">السؤال ${i + 1} من ${total}</div>
      <div class="quiz-q-text">${item.q}</div>`;

    const letters = ["أ","ب","ج","د"];
    item.opts.forEach((opt, oi) => {
      let cls = "quiz-opt";
      if (isAnswered) {
        cls += " answered";
        if (oi === item.c) cls += " correct";
        else if (oi === userAnswer && userAnswer !== item.c) cls += " wrong";
      }
      html += `<button class="${cls}" data-qi="${i}" data-oi="${oi}" ${isAnswered ? "disabled" : ""}>${letters[oi]}. ${opt}</button>`;
    });

    html += `<div class="quiz-exp ${isAnswered ? "show" : ""}">${item.exp}</div>`;
    html += `</div>`;
  });

  mc.innerHTML = html;

  mc.querySelectorAll(".quiz-opt:not(.answered)").forEach(btn => {
    btn.onclick = () => {
      const qi = parseInt(btn.dataset.qi);
      const oi = parseInt(btn.dataset.oi);
      const item = quiz[qi];
      qs.answers[qi] = oi;
      if (oi === item.c) qs.score++;
      storageSet("baji_quiz_v3", quizState);
      renderQuiz(mc, lesson);
    };
  });
}

window.retryQuiz = function() {
  const key = qKey();
  quizState[key] = { answers: {}, score: 0 };
  storageSet("baji_quiz_v3", quizState);
  renderContent();
};

/* ════════════════════════════════════════════════════════
   RENDER: Revision
   ════════════════════════════════════════════════════════ */
function renderRevision(mc, lesson) {
  const rev = lesson.revision || [];
  if (!rev.length) {
    mc.innerHTML = `<div class="empty-state"><span class="es-icon">🔄</span>لم تُضَف بطاقات مراجعة لهذا الدرس بعد.</div>`;
    return;
  }

  const key = qKey();
  if (!knownState[key]) knownState[key] = {};
  const ks = knownState[key];
  const knownCount = Object.values(ks).filter(Boolean).length;
  const total = rev.length;
  const pct = total ? Math.round((knownCount / total) * 100) : 0;

  let html = `<div class="rev-progress">
    <div class="rp-text">✅ أتقنتُ <b>${knownCount}</b> من <b>${total}</b> بطاقة</div>
    <div class="progress-bar" style="flex:1"><div class="progress-fill" style="width:${pct}%;background:#4CAF50"></div></div>
  </div>`;

  rev.forEach((item, i) => {
    const isKnown = ks[i];
    html += `<div class="rev-card ${isKnown ? "known" : ""}" data-ri="${i}">
      <div class="rev-q"><span class="q-icon">❓</span><span>${item.q}</span></div>
      <div class="rev-a" id="revA${i}">${fmtNums(item.a.replace(/\n/g, "<br>"))}</div>
      <div class="rev-actions" id="revAct${i}">
        <button class="btn-known ${isKnown ? "undo" : ""}" data-ri="${i}">${isKnown ? "↩️ لم أُتقنها بعد" : "✅ عرفتُها"}</button>
      </div>
    </div>`;
  });

  mc.innerHTML = html;

  mc.querySelectorAll(".rev-card").forEach(card => {
    card.onclick = (e) => {
      if (e.target.classList.contains("btn-known")) return;
      const ri = card.dataset.ri;
      const aEl = document.getElementById("revA" + ri);
      const actEl = document.getElementById("revAct" + ri);
      aEl.classList.toggle("show");
      actEl.classList.toggle("show");
    };
  });

  mc.querySelectorAll(".btn-known").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const ri = parseInt(btn.dataset.ri);
      ks[ri] = !ks[ri];
      storageSet("baji_known_v3", knownState);
      renderRevision(mc, lesson);
    };
  });
}

/* ════════════════════════════════════════════════════════
   RENDER ALL
   ════════════════════════════════════════════════════════ */
function renderAll() {
  renderYears();
  renderSubjects();
  renderModeBar();
  updateVisibility();
  if (currentMode === "lessons") {
    renderLessons();
    renderTabs();
    renderContent();
  } else {
    renderAttachments();
  }
}

renderAll();
</script>
